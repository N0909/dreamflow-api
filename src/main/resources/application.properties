spring.application.name=dreamflow-api

spring.mvc.servlet.path=/api

spring.datasource.url=${MYSQL_URL}/dreamflow_db_test
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.data.redis.host = localhost
spring.data.redis.port = 6379

spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secretkey = ${JWT_SECRET}

executor.media-processing.core-threads=10
executor.media-processing.max-threads=20
executor.media-processing.queue-capacity=50

executor.email.core-threads=5
executor.email.max-threads=10
executor.email.queue-capacity=100

executor.home.core-threads=2
executor.home.max-threads=4
executor.home.queue-capacity=50

rate_limit.threshold = 1000
rate_limit.time_limit = 1

clam_av.server_address = localhost
clam_av.server_port = 3310

media.storage.root=${MEDIA_STORAGE}

spring.elasticsearch.uris=http://localhost:9200

spring.profiles.active=dev

search.provider=elasticsearch

cache.max-size=10000

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
